name: coder frontend tests
on:
  pull_request:
    paths:
      - "coder-local"
      - "install-coder-local.sh"
      - "lib/coder_local_plan.py"
      - "tests/test_coder_local.py"
      - ".github/workflows/coder-frontends-tests.yml"
permissions:
  contents: read
jobs:
  qwen-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static and planner tests
        run: |
          bash -n coder-local install-coder-local.sh
          python3 -m py_compile lib/coder_local_plan.py
          python3 -m unittest -v tests/test_coder_local.py
          ./coder-local --self-test
      - name: Install official Qwen Code CLI
        run: |
          curl -fsSL https://qwen-code-assets.oss-cn-hangzhou.aliyuncs.com/installation/install-qwen-standalone.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Qwen Code smoke test
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          qwen --version
          qwen --help >/dev/null
