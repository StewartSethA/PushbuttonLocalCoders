name: coder frontend tests
on:
  pull_request:
    paths:
      - "pushbutton"
      - "pushbutton-instance"
      - "coder-local"
      - "qwen-local"
      - "opencode-local"
      - "deepseek-local"
      - "mini-swe-local"
      - "pushbutton-select"
      - "pushbutton-observe"
      - "pushbutton-proxy"
      - "pushbutton-broker"
      - "install-coder-local.sh"
      - "configs/qwen-local-defaults.json"
      - "configs/placement.example.json"
      - "configs/model-catalog.json"
      - "benchmarks/aggregate.json"
      - "lib/coder_local_*.py"
      - "lib/pushbutton_metrics.py"
      - "lib/pushbutton_policy.py"
      - "lib/pushbutton_pool.py"
      - "tests/test_coder_local.py"
      - "tests/test_selector.py"
      - "tests/test_metrics.py"
      - "tests/test_policy.py"
      - "tests/test_pool.py"
      - ".github/workflows/coder-frontends-tests.yml"
permissions:
  contents: read
jobs:
  qwen-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and data validation
        run: |
          bash -n coder-local install-coder-local.sh
          python3 -m py_compile lib/coder_local_plan.py lib/coder_local_lb.py lib/pushbutton_metrics.py lib/pushbutton_policy.py lib/pushbutton_pool.py pushbutton pushbutton-instance pushbutton-select pushbutton-observe pushbutton-proxy pushbutton-broker
          python3 -m json.tool configs/qwen-local-defaults.json >/dev/null
          python3 -m json.tool configs/placement.example.json >/dev/null
          python3 -m json.tool configs/model-catalog.json >/dev/null
          python3 -m json.tool benchmarks/aggregate.json >/dev/null
      - name: Unit tests
        run: python3 -m unittest -v tests/test_coder_local.py tests/test_selector.py tests/test_metrics.py tests/test_policy.py tests/test_pool.py
      - name: Planner self-test
        run: ./coder-local --self-test
      - name: Selector smoke
        run: ./pushbutton-select qwen3.8:27b --vram-limit 16G --ram-limit 32G --no-interactive --json >/dev/null
      - name: Runtime command smoke
        run: |
          python3 pushbutton --help >/dev/null
          python3 pushbutton-instance --help >/dev/null
          python3 pushbutton-observe --help >/dev/null
          python3 pushbutton-proxy --help >/dev/null
          python3 pushbutton-broker --help >/dev/null
      - name: Install official Qwen Code CLI
        run: |
          curl -fsSL https://qwen-code-assets.oss-cn-hangzhou.aliyuncs.com/installation/install-qwen-standalone.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Qwen Code smoke test
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          qwen --version
          qwen --help >/dev/null
  opencode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wrapper syntax
        run: bash -n opencode-local
      - name: Install OpenCode
        run: |
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: OpenCode smoke test
        run: |
          export PATH="$HOME/.opencode/bin:$HOME/.local/bin:$PATH"
          opencode --version
          opencode --help >/dev/null
  deepseek-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wrapper syntax
        run: bash -n deepseek-local
      - name: Install official DeepSeek Harness
        run: |
          npm install -g @deepseek-ai/dsh pnpm
          dsh --version
          dsh --help >/dev/null
      - name: Compose TUI profile
        run: |
          export DSH_HOME="$RUNNER_TEMP/dsh"
          dsh plugin --profile tui add @dsh-tui/dsh-tui
          dsh --profile tui --dump-config >/dev/null
  mini-swe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wrapper syntax
        run: bash -n mini-swe-local
      - name: Install mini-SWE-agent
        run: |
          python3 -m pip install --user mini-swe-agent
          export PATH="$HOME/.local/bin:$PATH"
          mini --help >/dev/null
