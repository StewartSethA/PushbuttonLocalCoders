name: claude-local tests

on:
  pull_request:
    paths:
      - "claude-local"
      - "lib/claude_local_*.py"
      - "tests/test_claude_local.py"
      - ".github/workflows/claude-local-tests.yml"
  push:
    branches:
      - "feature/claude-local-harness"
    paths:
      - "claude-local"
      - "lib/claude_local_*.py"
      - "tests/test_claude_local.py"
      - ".github/workflows/claude-local-tests.yml"

permissions:
  contents: read

jobs:
  static-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax
        run: bash -n ./claude-local
      - name: Python syntax
        run: python3 -m py_compile lib/claude_local_plan.py lib/claude_local_gateway.py tests/test_claude_local.py
      - name: Unit tests
        run: python3 -m unittest -v tests/test_claude_local.py
